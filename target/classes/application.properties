spring.application.name=flash-booking

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cielo-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cielo-user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cielo-pw}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=flashbooking-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.auto-startup=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Scheduler
flashbooking.scheduler.expiration-delay-ms=5000

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
